name: billbuddy
description: "Everyday bill management app."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get_it: ^8.0.2
  path_provider: ^2.1.6
  path: ^1.9.0
  google_mlkit_text_recognition: ^0.15.0
  permission_handler: ^13.0.1
  camera: ^0.12.0+2
  firebase_core: ^4.7.0
  firebase_ai: ^3.11.0
  firebase_app_check: ^0.4.3
  uuid: ^4.5.1
  sqflite: ^2.4.1
  shared_preferences: ^2.3.4
  image_picker: ^1.1.1
  cunning_document_scanner: ^3.0.2
  package_info_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
